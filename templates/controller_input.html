<!doctype html>
<html><head><meta charset="utf-8"><title>WURD Madden Controller Input Recorder v1</title>
<style>
body{font-family:Arial;background:#0b0d10;color:#eee;margin:0}.w{max-width:1000px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.c{background:#15181d;border:1px solid #444;border-radius:10px;padding:14px}
.v{font-size:27px;font-weight:bold}.on{outline:3px solid white}button{padding:10px;margin:5px;font-size:16px}
#log{width:100%;height:280px;background:#070809;color:#ddd;margin-top:15px;font-family:monospace}
</style></head><body><div class="w">
<h1>WURD Madden Controller Input Recorder</h1><p>v1 — keep this open while playing through chiaki-ng.</p>
<p id="status">Press a DualSense button.</p>
<button id="start">Start Recording</button><button id="stop" disabled>Stop Recording</button>
<button id="clear">Clear</button><button id="download" disabled>Download CSV</button>
<div class="grid">
<div class="c"><small>R2 PRESSURE</small><div class="v" id="r2">0%</div></div>
<div class="c" id="tc"><small>TRIANGLE</small><div class="v" id="tri">UP</div></div>
<div class="c" id="cc"><small>CIRCLE</small><div class="v" id="cir">UP</div></div>
<div class="c"><small>LEFT STICK</small><div class="v" id="ls">X +0.000<br>Y +0.000</div></div>
<div class="c"><small>RIGHT STICK</small><div class="v" id="rs">X +0.000<br>Y +0.000</div></div>
<div class="c"><small>RECORDING</small><div class="v" id="rec">STOPPED</div></div>
</div><textarea id="log" readonly></textarea>
<script>
// WURD Madden Controller Input Recorder v1.0
const $=x=>document.getElementById(x);let recording=false,t0=0,rows=[],last=null;
const gp=()=>[...navigator.getGamepads()].find(Boolean);
const f=n=>(n>=0?"+":"")+n.toFixed(3), dz=n=>Math.abs(n)<.06?0:n;
function state(g){return{lx:dz(g.axes[0]||0),ly:dz(g.axes[1]||0),rx:dz(g.axes[2]||0),ry:dz(g.axes[3]||0),
 circle:!!g.buttons[1]?.pressed,triangle:!!g.buttons[3]?.pressed,r2:g.buttons[7]?.value||0}}
function diff(a,b){return !b||Math.abs(a.lx-b.lx)>.025||Math.abs(a.ly-b.ly)>.025||Math.abs(a.rx-b.rx)>.025||
 Math.abs(a.ry-b.ry)>.025||Math.abs(a.r2-b.r2)>.01||a.circle!=b.circle||a.triangle!=b.triangle}
function ui(s){$("r2").textContent=Math.round(s.r2*100)+"%";$("tri").textContent=s.triangle?"DOWN":"UP";
 $("cir").textContent=s.circle?"DOWN":"UP";$("tc").classList.toggle("on",s.triangle);$("cc").classList.toggle("on",s.circle);
 $("ls").innerHTML=`X ${f(s.lx)}<br>Y ${f(s.ly)}`;$("rs").innerHTML=`X ${f(s.rx)}<br>Y ${f(s.ry)}`}
function loop(){let g=gp();if(g){$("status").textContent="Controller: "+g.id;let s=state(g);ui(s);
 if(recording&&diff(s,last)){let ms=Math.round(performance.now()-t0);rows.push([ms,(ms/1000).toFixed(3),s.r2.toFixed(3),+s.circle,+s.triangle,s.lx.toFixed(3),s.ly.toFixed(3),s.rx.toFixed(3),s.ry.toFixed(3)].join(","));
 $("log").value+=`${(ms/1000).toFixed(3)}s R2 ${Math.round(s.r2*100)}%  ○ ${s.circle?"DOWN":"up"}  △ ${s.triangle?"DOWN":"up"}  LS(${f(s.lx)},${f(s.ly)}) RS(${f(s.rx)},${f(s.ry)})\n`;
 $("log").scrollTop=$("log").scrollHeight;last={...s}}}requestAnimationFrame(loop)}
$("start").onclick=()=>{if(!gp())return alert("Controller not detected.");rows=["ms,seconds,r2,circle,triangle,left_x,left_y,right_x,right_y"];$("log").value="";last=null;t0=performance.now();recording=true;$("rec").textContent="RECORDING";$("start").disabled=true;$("stop").disabled=false;$("download").disabled=true};
$("stop").onclick=()=>{recording=false;$("rec").textContent="STOPPED";$("start").disabled=false;$("stop").disabled=true;$("download").disabled=rows.length<2};
$("clear").onclick=()=>{if(!recording){rows=[];$("log").value="";$("download").disabled=true}};
$("download").onclick=()=>{let b=new Blob([rows.join("\n")+"\n"],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="madden_controller_log_v1.csv";a.click()};
requestAnimationFrame(loop);
</script></div></body></html>
